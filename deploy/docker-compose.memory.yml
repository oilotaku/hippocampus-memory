# 記憶庫 + ChromaDB 服務 — 把這兩段加到你的 docker-compose.yml 的 services: 下面
# （和 astrbot、snowluma 平級）
#
# 注意：build 的 context 要指到記憶庫程式碼目錄（含 deploy/ 裡的 Dockerfile）。

  # ── 記憶庫主服務（Node.js）──
  memory-constellations:
    build:
      context: ./MemoryConstellations
      dockerfile: deploy/Dockerfile
    container_name: memory-constellations
    restart: always
    ports:
      - "3000:3000"                      # 記憶庫 HTTP（橋接外掛通過它訪問）
    environment:
      - TZ=Asia/Shanghai
      # ── 必填：下面兩個用 `openssl rand -hex 32` 生成 ──
      - SANCTUARY_ENCRYPTION_KEY=改成64位hex
      - SESSION_SECRET=改成64位hex
      - LOGIN_PASSWORD=改成你的登入密碼
      # ── 必填：至少配一個 LLM API key（記憶管線用）──
      - API_KEY=改成你的LLMkey
      # - GEMINI_API_KEY=或填Gemini的key
      - CHROMA_URL=http://chroma:7707     # 向量檢索服務地址（chroma 容器）
      - DB_PATH=/app/data/sanctuary.db   # 資料庫檔案落到持久化目錄
    volumes:
      - ./memory-data:/app/data          # 持久化資料庫 + 配置

  # ── ChromaDB + Embedding 服務（向量/語義檢索，可選）──
  chroma:
    build:
      context: ./MemoryConstellations
      dockerfile: deploy/Dockerfile.chroma
    container_name: chroma-service
    restart: always
    ports:
      - "7707:7707"                      # ChromaDB HTTP（記憶庫通過它做向量檢索）
    volumes:
      - ./chroma-data:/app/chroma_data   # 持久化向量資料
      - ./chroma-cache:/app/hf_cache     # 持久化 embedding 模型（避免每次重啟重新下載）
